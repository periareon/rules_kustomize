apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The chart packaged by the rules_helm `helm_chart` target in this
# package, unpacked below `charts/` by the `kustomization` target.
helmCharts:
- name: greeter
  releaseName: greeter
  valuesInline:
    greeting: hello

patches:
- target:
    kind: ConfigMap
  patch: |-
    - op: add
      path: /data/audience
      value: world
