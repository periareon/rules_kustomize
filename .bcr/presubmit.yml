matrix: &matrix
  platform:
  - debian13
  - macos
  - macos_arm64
  - rockylinux8
  - ubuntu2404
  - windows
  bazel:
  - 7.x
  - 8.x
  - 9.x
tasks:
  verify_targets:
    name: Verify that all tests succeed
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    test_targets:
    - '@rules_kustomize//test:all'
bcr_test_module:
  module_path: examples/simple
  matrix: *matrix
  tasks:
    run_test_module:
      name: Run test module
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
      - //...
      test_targets:
      - //...
