name: Release
on:
  # See https://docs.github.com/en/actions/reference/events-that-trigger-workflows.
  push:
    tags:
    - "v*.*.*"
jobs:
  release:
    name: Publish a GitHub release
    # This reusable workflow builds and tests all Bazel targets at the
    # tag, runs ".github/workflows/release_prep.sh" to produce the
    # source archive and release notes, attests the archive's build
    # provenance and issues the GitHub release with the archive and
    # its attestation attached. The Bazel Central Registry verifies
    # that an archive's provenance was produced by this very workflow,
    # so attesting here with "actions/attest-build-provenance" directly
    # would yield a valid attestation that the registry still rejects.
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.6.0
    permissions:
      contents: write
      # Needed to attest provenance.
      id-token: write
      attestations: write
    with:
      prerelease: false
      release_files: vcs-archive-*.tar.gz
  call-release-to-bcr:
    name: Induce publishing a release to the BCR
    needs: release
    uses: ./.github/workflows/publish-to-bcr.yaml
    with:
      tag_name: ${{ github.ref_name }}
    # A called workflow can use no more permissions than the calling
    # job grants it.
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
