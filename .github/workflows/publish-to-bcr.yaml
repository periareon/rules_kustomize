name: Publish Release to the BCR
on:
  # Run the publish workflow after a successful release.
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: true
  # In case of problems, allow retrying by dispatching the workflow
  # from the GitHub UI or API manually.
  workflow_dispatch:
    inputs:
      tag_name:
        type: string
        required: true
jobs:
  publish:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.1
    with:
      tag_name: ${{ inputs.tag_name }}
      # GitHub repository which is a fork of the upstream where the
      # Pull Request will be opened.
      registry_fork: seh/bazel-central-registry
      # Attest the generated "source.json" and "MODULE.bazel" entry
      # files, uploading those attestations to the release, and refer
      # to the release archive's own provenance attestation from the
      # registry entry. The release workflow uploads the archive and
      # that attestation as workflow run artifacts under the names
      # this workflow looks for ("release_files" and "attestations"),
      # falling back to the release's assets when dispatched manually.
      attest: true
    permissions:
      contents: write
      # "write" permission is necessary if "attest" is true.
      id-token: write
      # "write" permission is necessary if "attest" is true.
      attestations: write
    secrets:
      # This token is necessary to push to the BCR fork, and to open a
      # pull request against a registry.
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
